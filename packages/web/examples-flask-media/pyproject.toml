[project]
authors = [{ name = "A.suzuki", email = "suzu.devworks@gmail.com" }]
description = "Default template for PDM package"
license = { text = "MIT" }
name = "examples-flask-media"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

dependencies = ["flask-cors>=6.0.5", "flask>=3.1.3", "opencv-python>=5.0.0.93"]

[dependency-groups]
dev = ["types-flask-cors>=6.0.3.20260712"]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.0,<0.13.0"]

[tool.pdm.scripts]
dev = "flask --app examples_flask_media run --debug"
