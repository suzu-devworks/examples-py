[project]
authors = [{ name = "A.suzuki", email = "suzu.devworks@gmail.com" }]
dependencies = []
description = "Default template for PDM package"
license = { text = "MIT" }
name = "examples-playwright"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[dependency-groups]
dev = [
  "playwright>=1.61.0",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pytest-httpserver>=1.1.5",
  "pytest-playwright>=0.8.0",
  "pytest-xdist>=3.8.0",
  "pytest>=9.1.1",
  "trustme>=1.2.1",
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.0,<0.13.0"]

[tool.pytest]
addopts = ["--import-mode=importlib", "--numprocesses=auto"]
