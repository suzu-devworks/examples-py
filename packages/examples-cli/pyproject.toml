[project]
authors = [
  { name = "A.suzuki", email = "suzu.devworks@gmail.com" },
]
dependencies = [
  "examples-lib",
  "pillow>=12.3.0",
  "pyyaml>=6.0.3",
]
description = "Add your description here"
name = "examples-cli"
readme = "README.md"
requires-python = ">= 3.12"
version = "0.1.0"

[project.scripts]
"examples-cli" = "examples_cli:main"

[build-system]
build-backend = "uv_build"
